appId: com.mahroum.yoman
productName: יומן עבודה
copyright: יומן עבודה

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.icns
  # No Apple developer account, so the app ships unsigned: the first launch
  # needs right-click → Open. See README.
  identity: null
  darkModeSupport: true

dmg:
  title: יומן עבודה
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
