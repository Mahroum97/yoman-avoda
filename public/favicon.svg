<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="יומן עבודה">
  <!--
    The mark is the document the app makes.

    Every page this app exports opens with a navy header band and an amber rule
    under it, over a ruled sheet — so that is the icon, rather than a clipboard
    or a hard hat that could belong to any site app. It also survives being
    small: a tile, a page, one amber line and three rules still read at 16px,
    where the old clip-and-checkmark version turned to mush.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17456e" />
      <stop offset="1" stop-color="#0c2540" />
    </linearGradient>
    <clipPath id="page">
      <rect x="132" y="100" width="248" height="312" rx="26" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)" />

  <!-- The sheet, with a hairline edge so it reads as paper on navy. -->
  <rect x="132" y="100" width="248" height="312" rx="26" fill="#ffffff" />

  <g clip-path="url(#page)">
    <!-- The document's own header band, and the amber rule beneath it. -->
    <rect x="132" y="100" width="248" height="58" fill="#0f2d4a" />
    <rect x="132" y="158" width="248" height="13" fill="#d97706" />
  </g>

  <!-- Three written lines. The last is short, the way a real one ends. -->
  <g fill="#0f2d4a">
    <rect x="168" y="216" width="176" height="19" rx="9.5" opacity="0.9" />
    <rect x="168" y="266" width="176" height="19" rx="9.5" opacity="0.62" />
    <rect x="168" y="316" width="104" height="19" rx="9.5" opacity="0.4" />
  </g>
</svg>
