<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2d4a" />
    <meta
      name="description"
      content="יומן עבודה לאתרי בנייה — רישום יומי של עובדים, ציוד ויציקות והפקת דוח Word"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="יומן עבודה" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>יומן עבודה</title>
    <script>
      // Apply the saved theme and language before first paint, so opening the
      // app never flashes a white screen or the wrong writing direction.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('yoman-theme');
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';

          var lang = localStorage.getItem('yoman-lang');
          if (lang !== 'he' && lang !== 'ar' && lang !== 'en') lang = 'he';
          root.lang = lang;
          root.dir = lang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
