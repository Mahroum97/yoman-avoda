<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="יומן עבודה לאתרי בנייה — רישום יומי של עובדים, ציוד ויציקות והפקת דוח Word"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` rather than `black-translucent`: translucent forces dark
         status-bar text regardless of the theme, which is unreadable once the
         top bar is light. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="יומן עבודה" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>יומן עבודה</title>
    <script>
      // Apply the saved theme and language before first paint, so opening the
      // app never flashes a white screen or the wrong writing direction.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('yoman-theme');
          // Auto — anything not stored as an explicit choice — follows the
          // system, which only ever means light or dark.
          if (theme !== 'light' && theme !== 'dark' && theme !== 'black') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = theme;
          // Must match STRIP_COLOUR in src/hooks/useTheme.ts.
          var strips = { light: '#ffffff', dark: '#16293f', black: '#000000' };
          var strip = document.querySelector('meta[name="theme-color"]');
          if (strip) strip.setAttribute('content', strips[theme]);

          var lang = localStorage.getItem('yoman-lang');
          if (lang !== 'he' && lang !== 'ar' && lang !== 'en') lang = 'he';
          root.lang = lang;
          root.dir = lang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
